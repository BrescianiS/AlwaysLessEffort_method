name: tests

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: python

      - name: Run tests
        working-directory: python
        run: pytest